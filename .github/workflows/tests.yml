name: Run Pytest Test Cases

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:

        # Test files that GitHub Action will run
        test_file: [
          "tests/unit/test_io.py",
          "tests/unit/test_solver.py",
          "tests/unit/test_utils.py"
        ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true # speeds up for future test runs

      - name: Install all dependencies
        run: uv sync --no-dev

      - name: Run unit tests
        run: uv run pytest ${{ matrix.test_file }}
